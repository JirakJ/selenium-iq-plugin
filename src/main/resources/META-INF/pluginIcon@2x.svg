<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient2x" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#43A047;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="seleniumGradient2x" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background with rounded corners -->
    <rect width="80" height="80" rx="16" fill="url(#bgGradient2x)"/>
    
    <!-- Selenium-inspired browser window -->
    <rect x="12" y="14" width="56" height="32" rx="4" fill="#1B5E20" opacity="0.4" filter="url(#shadow)"/>
    <rect x="12" y="14" width="56" height="6" rx="4" fill="url(#seleniumGradient2x)"/>
    
    <!-- Browser dots -->
    <circle cx="18" cy="17" r="1.6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="24" cy="17" r="1.6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="30" cy="17" r="1.6" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Content lines in browser -->
    <rect x="18" y="26" width="44" height="2" rx="1" fill="#81C784" opacity="0.5"/>
    <rect x="18" y="32" width="36" height="2" rx="1" fill="#81C784" opacity="0.4"/>
    <rect x="18" y="38" width="40" height="2" rx="1" fill="#81C784" opacity="0.3"/>
    
    <!-- AI/IQ branding - larger and more prominent -->
    <text x="40" y="66" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">IQ</text>
    
    <!-- Smart indicator (lightning bolt for AI) -->
    <path d="M 42 26 L 36 36 L 40 36 L 38 44 L 46 34 L 42 34 Z" fill="#FDD835" opacity="0.95" filter="url(#shadow)"/>
    
    <!-- Decorative elements - small circles representing test nodes -->
    <circle cx="22" cy="28" r="1.5" fill="#4CAF50" opacity="0.7"/>
    <circle cx="28" cy="35" r="1.5" fill="#66BB6A" opacity="0.7"/>
    <circle cx="54" cy="30" r="1.5" fill="#81C784" opacity="0.7"/>
</svg>

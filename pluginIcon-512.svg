<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#43A047;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#388E3C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="seleniumGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FDD835;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow512">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background with rounded corners -->
    <rect width="512" height="512" rx="96" fill="url(#bgGradient512)"/>
    
    <!-- Outer glow effect -->
    <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#66BB6A" stroke-width="2" opacity="0.3"/>
    
    <!-- Selenium-inspired browser window -->
    <g filter="url(#shadow512)">
        <rect x="76" y="90" width="360" height="205" rx="20" fill="#1B5E20" opacity="0.5"/>
        <rect x="76" y="90" width="360" height="38" rx="20" fill="url(#seleniumGradient512)"/>
    </g>
    
    <!-- Browser control dots -->
    <circle cx="105" cy="109" r="10" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="135" cy="109" r="10" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="165" cy="109" r="10" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Browser address bar -->
    <rect x="195" y="99" width="220" height="20" rx="10" fill="#1B5E20" opacity="0.4"/>
    <text x="305" y="114" font-family="Arial, sans-serif" font-size="14" fill="#A5D6A7" text-anchor="middle" opacity="0.7">https://test.selenium.iq</text>
    
    <!-- Content lines in browser window -->
    <rect x="100" y="155" width="310" height="12" rx="6" fill="#81C784" opacity="0.6"/>
    <rect x="100" y="180" width="260" height="12" rx="6" fill="#81C784" opacity="0.5"/>
    <rect x="100" y="205" width="290" height="12" rx="6" fill="#81C784" opacity="0.4"/>
    <rect x="100" y="230" width="240" height="12" rx="6" fill="#81C784" opacity="0.3"/>
    <rect x="100" y="255" width="270" height="12" rx="6" fill="#81C784" opacity="0.25"/>
    
    <!-- Checkmarks indicating successful tests -->
    <g opacity="0.7">
        <path d="M 95 162 L 100 167 L 110 152" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
        <path d="M 95 187 L 100 192 L 110 177" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
        <path d="M 95 212 L 100 217 L 110 202" fill="none" stroke="#66BB6A" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- AI/IQ branding - large and prominent -->
    <g filter="url(#glow)">
        <text x="256" y="400" font-family="Arial, Helvetica, sans-serif" font-size="140" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">IQ</text>
    </g>
    
    <!-- Subtitle -->
    <text x="256" y="445" font-family="Arial, sans-serif" font-size="28" fill="#E8F5E9" text-anchor="middle" opacity="0.9">Selenium Intelligence</text>
    
    <!-- Smart indicator (lightning bolt for AI) - larger and more prominent -->
    <g filter="url(#shadow512)">
        <path d="M 270 165 L 230 230 L 260 230 L 245 280 L 295 215 L 270 215 Z" fill="url(#lightningGradient)" opacity="0.95"/>
    </g>
    
    <!-- Decorative elements - test node connections -->
    <g opacity="0.5">
        <circle cx="140" cy="180" r="8" fill="#4CAF50"/>
        <circle cx="180" cy="220" r="8" fill="#66BB6A"/>
        <circle cx="220" cy="190" r="8" fill="#81C784"/>
        <circle cx="350" cy="200" r="8" fill="#A5D6A7"/>
        
        <line x1="140" y1="180" x2="180" y2="220" stroke="#66BB6A" stroke-width="2" opacity="0.4"/>
        <line x1="180" y1="220" x2="220" y2="190" stroke="#66BB6A" stroke-width="2" opacity="0.4"/>
        <line x1="220" y1="190" x2="350" y2="200" stroke="#66BB6A" stroke-width="2" opacity="0.4"/>
    </g>
    
    <!-- Corner accent marks -->
    <path d="M 60 60 L 60 100 M 60 60 L 100 60" stroke="#81C784" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M 452 60 L 412 60 M 452 60 L 452 100" stroke="#81C784" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M 60 452 L 60 412 M 60 452 L 100 452" stroke="#81C784" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M 452 452 L 452 412 M 452 452 L 412 452" stroke="#81C784" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>
